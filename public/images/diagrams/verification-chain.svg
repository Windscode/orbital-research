<text x="1180" y="841" font-size="24">运行与输出</text>
<text x="70" y="881" fill="#9faeb2" font-size="22">贯穿全链的溯源：来源标识 · 单位 / 坐标 / 时间 · 假设 · 版本 · 运行配置</text>

