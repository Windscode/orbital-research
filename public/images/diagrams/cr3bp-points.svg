<text x="1086" y="287" font-size="21" fill="#e4e9df" >两主天体作圆周运动</text>
<text x="1086" y="326" font-size="21" fill="#e4e9df" >航天器质量可忽略</text>
<text x="1086" y="365" font-size="21" fill="#e4e9df" >无推力及额外摄动</text>
<line x1="1086" y1="391" x2="1320" y2="391" stroke="#33454c" stroke-width="2" />
