<text x="1086" y="481" font-size="26" fill="#cfb280" >L₁ / L₂ / L₃</text>
<text x="1086" y="519" font-size="21" fill="#8a9e9e" >平衡点线性不稳定</text>
<text x="1086" y="564" font-size="26" fill="#d3ef83" >L₄ / L₅</text>
<text x="1086" y="602" font-size="21" fill="#8a9e9e" >满足质量比稳定条件</text>
<text x="1086" y="655" font-size="27" fill="#e4e9df" >C = 2Ω − |v|²</text>
<text x="1086" y="702" font-size="20" fill="#8a9e9e" >C 仅在该理想模型守恒</text>
<text x="56" y="800" font-size="26" fill="#cfb280" >固定于旋转坐标系 ≠ 惯性静止；平动点处的引力并没有消失。</text>
